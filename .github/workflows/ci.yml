name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Không truyền version: lấy theo "packageManager" trong package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # tsc -b + vite build; plugin router sinh lại routeTree.gen.ts trong lúc build
      - run: pnpm build
      - name: Check routeTree.gen.ts is committed up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - run: docker build --tag amb-storage-admin:ci .
      - name: Smoke test the image (SPA fallback, asset 404, health)
        run: |
          set -euo pipefail
          docker run -d --name admin-ci -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 amb-storage-admin:ci
          trap 'docker rm -f admin-ci >/dev/null' EXIT
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/catalog/products | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing-chunk.js)" = 404
      - run: git diff --check
